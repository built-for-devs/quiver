# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: quiver

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: quiver
    main: .
    binary: quiver
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/built-for-devs/quiver/cmd.Version={{ .Version }}

archives:
  - id: quiver
    # No version in the name, so releases/latest/download/<name> is stable.
    # action.yml depends on this naming.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "

# This repo doubles as the Homebrew tap: the cask is committed to Casks/ on
# main, using the release workflow's GITHUB_TOKEN.
homebrew_casks:
  - name: quiver
    repository:
      owner: built-for-devs
      name: quiver
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://quivergtm.dev/
    description: Command-line client for Quiver
    skip_upload: auto # not for prereleases
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "Update Homebrew cask to {{ .Tag }} [skip ci]"
    # Binaries are not notarized; clear the quarantine flag so macOS runs
    # them. Uses Homebrew's postflight_steps (plain postflight is deprecated).
    # {{staged_path}} is a Homebrew token, escaped from GoReleaser templating.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/quiver"]
        end
      end

release:
  github:
    owner: built-for-devs
    name: quiver
  prerelease: auto
