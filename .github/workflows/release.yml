name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commits the cask to built-for-devs/homebrew-tap. Fine-grained
          # token with Contents: read and write on that repo only.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Keep the major tag (v0, v1, ...) pointing at the latest stable
      # release, so workflows can use built-for-devs/quiver@v0.
      - name: Move major version tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag --force "$major"
          git push --force origin "refs/tags/$major"
