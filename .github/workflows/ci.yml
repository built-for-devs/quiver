name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=before

  # Run the composite action from this checkout, built from source.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check valid content
        uses: ./
        with:
          version: source
          args: content check examples/posts --strict
      - name: Check invalid content, reporting only
        id: report
        uses: ./
        with:
          version: source
          args: content check testdata/action/invalid
          fail-on-error: "false"
      - name: Check invalid content, failing (expected to fail)
        id: failing
        uses: ./
        continue-on-error: true
        with:
          version: source
          args: content check testdata/action/invalid
      - name: Assert exit codes
        env:
          REPORTED: ${{ steps.report.outputs.exit-code }}
          OUTCOME: ${{ steps.failing.outcome }}
        run: |
          fail=0
          if [ "$REPORTED" != 5 ]; then
            echo "::error::fail-on-error false: expected exit-code output 5, got '$REPORTED'"; fail=1
          fi
          if [ "$OUTCOME" != failure ]; then
            echo "::error::fail-on-error true: expected the step to fail, got '$OUTCOME'"; fail=1
          fi
          if [ "$QUIVER_EXIT_CODE" != 5 ]; then
            echo "::error::expected QUIVER_EXIT_CODE=5, got '$QUIVER_EXIT_CODE'"; fail=1
          fi
          exit "$fail"
